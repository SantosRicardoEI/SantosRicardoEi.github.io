<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loja</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <img id="logo-title" src="images/deisi-inverse.svg" alt="Deisi">

        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="#coluna-produtos">Produtos</a></li>
                <li><a href="#coluna-cesto">Cesto</a></li>
            </ul>
        </nav>
    </header>

    <main class="layout-loja" id="topo">
        <section id="coluna-produtos" aria-labelledby="titulo-produtos">
            <h2 class="section-name" id="titulo-produtos">
                Selecione os seus produtos
            </h2>

            <fieldset id="filtros-container">

                <label for="filtro-categoria">Categoria:</label>
                <select id="filtro-categoria">
                    <!-- O JavaScript adiciona as categorias aqui -->
                </select>

                <label for="filtro-ordenacao">Ordenar:</label>
                <select id="filtro-ordenacao">
                    <option value="preco-cre">Preço crescente</option>
                    <option value="preco-dec">Preço decrescente</option>
                </select>

                <label for="filtro-busca">Procurar:</label>
                <input
                    type="search"
                    id="filtro-busca"
                    placeholder="Pesquisar produtos"
                >
            </fieldset>

            <div id="produtos">
                <!-- O JavaScript adiciona os artigos dos produtos aqui -->
            </div>
        </section>

        <section id="coluna-cesto" aria-labelledby="titulo-cesto">
            <h2 class="section-name" id="titulo-cesto">Cesto</h2>

            <div id="cesto">
                <!-- O JavaScript adiciona os artigos do cesto aqui -->
            </div>
        </section>

        <section id="checkout" aria-labelledby="titulo-checkout">
            <h2 class="section-name" id="titulo-checkout">Checkout</h2>
            <form id="checkout-form">
                <label for="estudante">És estudante do DEISI? </label>
                <input type="checkbox" id="estudante" name="estudante">

                <label for="nome">Nome: </label>
                <input type="text" id="nome" name="nome" placeholder="Nome">

                <label for="cupao">Cupão de desconto: </label>
                <input type="text" id="cupao" name="cupao" placeholder="Cupão">

                <span>Total (sem descontos): </span>
                <s id="total-original" hidden></s>
                <span id="total">0€</span>
                <button type="submit">Finalizar Compra</button>
            </form>
        </section>

        <section id="Payment"></section>

        

    </main>

    <footer>
        <p>DIW 2026 — Ricardo Santos</p>
    </footer>

    <script src="scripts/produtos.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
