<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleção de Cromos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Coleção de Cromos</h1>
    </header>

    <main>
        <section id="colecao">
            <h2>A minha coleção</h2>
            <ul></ul>
            <h3>Total de cromos: <span>0</span></h3>
        </section>

        <section id="repetidos">
            <h2>Cromos repetidos</h2>
            <ul></ul>
            <h3>Total de repetidos: <span>0</span></h3>
        </section>

        <section id="registo">
            <h2>Registar novo cromo</h2>
            <form>
                <input type="number" placeholder="Número" required>
                <input type="submit" value="Registar Cromo" autofocus>
            </form>
        </section>
    </main>

    <footer>2026, DIW - Lab 6</footer>

    <script src="scripts/script.js"></script>
</body>
</html>
